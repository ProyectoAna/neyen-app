name: n8n Health Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Hostinger n8n health (read only)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            https://n8n.thespiralwithin.ai/healthz > /tmp/n8n-health.txt
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          body = Path('/tmp/n8n-health.txt').read_text().strip()
          assert body == 'ok' or json.loads(body).get('status') == 'ok', 'Unexpected n8n health response'
          PYTHON
          echo 'n8n /healthz returned ok. Workflow execution has not been tested.' >> "$GITHUB_STEP_SUMMARY"
