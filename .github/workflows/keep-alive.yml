name: Keep Render Alive

on:
  # Schedule disabled 2026-10-13: the Render instance no longer responds.
  # n8n now runs on the Hostinger VPS (n8n.thespiralwithin.ai), which does not sleep.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping n8n webhook endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            https://n8n.thespiralwithin.ai/healthz || true
