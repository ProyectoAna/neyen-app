name: Smoke Test — Read-only Services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Check web, n8n health and Supabase reads
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      N8N_BASE: https://n8n.thespiralwithin.ai
      APP_BASE: https://neyen.thespiralwithin.ai
      SUPABASE_URL: https://gsmtzdramqzcqdywboro.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Check published application pages
        run: |
          set -euo pipefail
          for path in / /graph/ /system.html; do
            CODE=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 30 "$APP_BASE$path")
            [ "$CODE" = '200' ] || { echo "::error::Application $path returned HTTP $CODE"; exit 1; }
          done
          echo 'Application pages: HTTP 200. UI behaviour has not been tested.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check n8n health without invoking workflows
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$N8N_BASE/healthz" > /tmp/n8n-health.txt
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          body = Path('/tmp/n8n-health.txt').read_text().strip()
          assert body == 'ok' or json.loads(body).get('status') == 'ok', 'Unexpected n8n health response'
          PYTHON
          echo 'n8n /healthz: ok. Slack commands and workflow execution have not been tested.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check read-only Supabase RPCs
        if: env.SUPABASE_ANON_KEY != ''
        run: |
          set -euo pipefail
          # These POST requests invoke read-only RPCs used by the application.
          # Never invoke tagging, crosslinking, ingestion or Slack webhooks here.
          for rpc in role_distribution graph_data; do
            curl --fail --silent --show-error --max-time 30 \
              -X POST "$SUPABASE_URL/rest/v1/rpc/$rpc" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H 'Content-Type: application/json' \
              -d '{}' > "/tmp/$rpc.json"
          done
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          roles = json.loads(Path('/tmp/role_distribution.json').read_text())
          graph = json.loads(Path('/tmp/graph_data.json').read_text())
          for name, data in [('role_distribution', roles), ('graph_data', graph)]:
              assert isinstance(data, dict), f'{name}: expected JSON object'
              assert type(data.get('total')) is int and data['total'] >= 0, f'{name}: invalid total'
          assert 'by_role' in roles, 'role_distribution: missing by_role'
          assert isinstance(graph.get('nodes'), list), 'graph_data: missing nodes array'
          assert graph['total'] == len(graph['nodes']), 'graph_data: total does not match nodes'
          PYTHON
          echo 'Supabase role_distribution and graph_data: valid responses. No write RPCs invoked.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report unavailable Supabase check
        if: env.SUPABASE_ANON_KEY == ''
        run: |
          echo '::warning::SUPABASE_ANON_KEY unavailable; Supabase checks skipped.'
          echo 'Supabase: NOT CHECKED (SUPABASE_ANON_KEY unavailable).' >> "$GITHUB_STEP_SUMMARY"
