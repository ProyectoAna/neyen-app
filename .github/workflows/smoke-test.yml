name: Smoke Test — n8n Webhooks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Hit WF-01 → WF-05 webhooks + Supabase RPCs
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      N8N_BASE: https://n8n-docker-t9sr.onrender.com
      SUPABASE_URL: https://gsmtzdramqzcqdywboro.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_NEYEN_CORE }}

    steps:
      - name: Wake n8n (Render cold-start)
        run: |
          echo "::group::Pinging n8n"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$N8N_BASE/")
            echo "Attempt $i → HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::n8n did not wake up"; exit 1; }
          echo "::endgroup::"

      - name: "WF-01: url_verification challenge"
        run: |
          RESP=$(curl -sf --max-time 30 \
            -X POST "$N8N_BASE/webhook/wf01-ingest" \
            -H "Content-Type: application/json" \
            -d '{"type":"url_verification","challenge":"gh_smoke_test","token":"test"}')
          echo "Response: $RESP"
          echo "$RESP" | grep -q "gh_smoke_test" \
            || { echo "::error::WF-01 url_verification failed — challenge not echoed"; exit 1; }
          echo "✓ WF-01 url_verification OK"

      - name: "WF-01: message ingestion (ACK)"
        run: |
          CODE=$(curl -s -o /tmp/wf01-ack.txt -w '%{http_code}' --max-time 30 \
            -X POST "$N8N_BASE/webhook/wf01-ingest" \
            -H "Content-Type: application/json" \
            -d '{
              "type":"event_callback",
              "event":{
                "type":"message",
                "text":"GH Actions smoke test — ignore",
                "user":"U_SMOKETEST",
                "channel":"C_SMOKETEST",
                "ts":"'$(date +%s)'.000000",
                "bot_id":"B_SMOKETEST"
              },
              "event_id":"smoke_'$(date +%s)'"
            }')
          echo "HTTP $CODE — body: $(cat /tmp/wf01-ack.txt)"
          [ "$CODE" = "200" ] \
            || { echo "::error::WF-01 message endpoint returned HTTP $CODE"; exit 1; }
          echo "✓ WF-01 message ACK OK (bot_id set → filtered, no side-effects)"

      - name: "WF-02: crosslink RPC"
        run: |
          RESP=$(curl -sf --max-time 30 \
            -X POST "$N8N_BASE/webhook/wf02-crosslink" \
            -H "Content-Type: application/json" \
            -d '{"file_name":"__smoke_test_nonexistent__"}')
          echo "Response: $RESP"
          echo "$RESP" | grep -qE '"status"\s*:\s*"(ok|error)"' \
            || { echo "::error::WF-02 did not return a valid status"; exit 1; }
          echo "✓ WF-02 crosslink webhook alive"

      - name: "WF-03: notification dry-run"
        run: |
          CODE=$(curl -s -o /tmp/wf03-resp.txt -w '%{http_code}' --max-time 30 \
            -X POST "$N8N_BASE/webhook/wf03-crosslink-notify" \
            -H "Content-Type: application/json" \
            -d '{
              "entry_id":"00000000-0000-0000-0000-000000000000",
              "file_name":"__smoke_test__",
              "related_ids":[],
              "related_count":0,
              "tags":["smoke","test"],
              "entities":["CI"],
              "summary":"GitHub Actions smoke test — dry run"
            }')
          echo "HTTP $CODE — body: $(cat /tmp/wf03-resp.txt)"
          [ "$CODE" = "200" ] \
            || { echo "::error::WF-03 webhook returned HTTP $CODE"; exit 1; }
          echo "✓ WF-03 notification webhook alive"

      - name: "WF-05: /tag command — invalid syntax returns error"
        run: |
          RESP=$(curl -sf --max-time 30 \
            -X POST "$N8N_BASE/webhook/wf05-slack-tagger" \
            -H "Content-Type: application/json" \
            -d '{"text":"/tag","user_id":"U_SMOKE","channel_id":"C_SMOKE"}')
          echo "Response: $RESP"
          # Malformed /tag should return status=error_sent (parse error path)
          echo "$RESP" | grep -qE '"status"\s*:\s*"error_sent"' \
            || { echo "::error::WF-05 /tag syntax error path not returning error_sent"; exit 1; }
          echo "✓ WF-05 /tag syntax error handled correctly"

      - name: "WF-05: /graph command — returns ok"
        run: |
          RESP=$(curl -sf --max-time 30 \
            -X POST "$N8N_BASE/webhook/wf05-slack-tagger" \
            -H "Content-Type: application/json" \
            -d '{"text":"/graph","user_id":"U_SMOKE","channel_id":"C_SMOKE"}')
          echo "Response: $RESP"
          echo "$RESP" | grep -qE '"status"\s*:\s*"ok"' \
            || { echo "::error::WF-05 /graph did not return ok"; exit 1; }
          echo "✓ WF-05 /graph command OK"

      - name: "Supabase: crosslink_entry RPC reachable"
        if: env.SUPABASE_ANON_KEY != ''
        run: |
          RESP=$(curl -sf --max-time 15 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/crosslink_entry" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_file_name":"__smoke_test_nonexistent__"}')
          echo "Response: $RESP"
          echo "$RESP" | grep -q '"status"' \
            || { echo "::error::Supabase crosslink_entry RPC unreachable or broken"; exit 1; }
          echo "✓ Supabase crosslink_entry RPC OK"

      - name: "Supabase: tag_entry() RPC — validates bad role and returns error"
        if: env.SUPABASE_ANON_KEY != ''
        run: |
          RESP=$(curl -sf --max-time 15 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/tag_entry" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_file_name":"__nonexistent__","p_field":"narrative_role","p_values":["__bad_role__"]}')
          echo "Response: $RESP"
          # Should return status=error (bad role validation or entry not found — both valid RPC responses)
          echo "$RESP" | grep -q '"status"' \
            || { echo "::error::tag_entry() RPC unreachable or broken — no status in response"; exit 1; }
          echo "$RESP" | grep -q '"error"' \
            || { echo "::error::tag_entry() RPC did not return an error for bad role + nonexistent entry"; exit 1; }
          echo "✓ Supabase tag_entry() RPC validation OK"

      - name: "Supabase: role_distribution() RPC reachable"
        if: env.SUPABASE_ANON_KEY != ''
        run: |
          RESP=$(curl -sf --max-time 15 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/role_distribution" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Response (truncated): ${RESP:0:200}"
          echo "$RESP" | grep -q '"total"' \
            || { echo "::error::role_distribution() RPC unreachable or broken — no total field"; exit 1; }
          echo "$RESP" | grep -q '"by_role"' \
            || { echo "::error::role_distribution() RPC missing by_role field"; exit 1; }
          TOTAL=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('total', -1))" 2>/dev/null || echo "-1")
          echo "Total entries: $TOTAL"
          [ "$TOTAL" -ge 0 ] 2>/dev/null \
            || { echo "::error::role_distribution() returned invalid total"; exit 1; }
          echo "✓ Supabase role_distribution() RPC OK ($TOTAL entries)"

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Smoke Test Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| WF-01 url_verification | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| WF-01 message ACK | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| WF-02 crosslink | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| WF-03 notification | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| WF-05 /tag syntax error | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| WF-05 /graph command | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase crosslink_entry() | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase tag_entry() validation | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase role_distribution() | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_$(date -u +%Y-%m-%dT%H:%M:%SZ)_" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1 | sed 's/"/\\"/g')
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          FAILED_STEP="unknown"
          if ! curl -sf --max-time 5 -X POST "$N8N_BASE/webhook/wf01-ingest" \
            -H "Content-Type: application/json" \
            -d '{"type":"url_verification","challenge":"probe","token":"x"}' | grep -q probe 2>/dev/null; then
            FAILED_STEP="WF-01 url_verification"
          elif ! curl -sf --max-time 5 -X POST "$N8N_BASE/webhook/wf02-crosslink" \
            -H "Content-Type: application/json" \
            -d '{"file_name":"__probe__"}' 2>/dev/null | grep -q status; then
            FAILED_STEP="WF-02 crosslink"
          elif ! curl -sf --max-time 5 -o /dev/null -X POST "$N8N_BASE/webhook/wf03-crosslink-notify" \
            -H "Content-Type: application/json" \
            -d '{"entry_id":"00000000-0000-0000-0000-000000000000","related_count":0}' 2>/dev/null; then
            FAILED_STEP="WF-03 notification"
          elif ! curl -sf --max-time 5 -X POST "$N8N_BASE/webhook/wf05-slack-tagger" \
            -H "Content-Type: application/json" \
            -d '{"text":"/graph","user_id":"U_PROBE"}' 2>/dev/null | grep -q ok; then
            FAILED_STEP="WF-05 /graph"
          elif ! curl -sf --max-time 5 -X POST "$SUPABASE_URL/rest/v1/rpc/tag_entry" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"p_file_name":"__x__","p_field":"narrative_role","p_values":["__bad__"]}' 2>/dev/null | grep -q status; then
            FAILED_STEP="Supabase tag_entry() RPC"
          elif ! curl -sf --max-time 5 -X POST "$SUPABASE_URL/rest/v1/rpc/role_distribution" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{}' 2>/dev/null | grep -q total; then
            FAILED_STEP="Supabase role_distribution() RPC"
          else
            FAILED_STEP="Supabase crosslink_entry() RPC"
          fi

          curl -sf -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \":red_circle: *Smoke Test Failed*\n\n*Broken step:* ${FAILED_STEP}\n*Commit:* <https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}|${SHORT_SHA}> — ${COMMIT_MSG}\n*Pushed by:* ${{ github.actor }}\n*Run:* <${RUN_URL}|View logs>\n\n_$(date -u +%Y-%m-%dT%H:%M:%SZ)_\"}" \
            || echo "::warning::Slack notification failed"
