<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEYEN — Crosslink Graph</title>
  <meta name="description" content="Live crosslink graph from the NEYEN metadata knowledge base. Nodes are entries, edges are related_ids connections.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header" role="banner">
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="14" stroke="var(--color-primary)" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="6" fill="var(--color-primary)" opacity="0.3"/>
          <circle cx="16" cy="16" r="2.5" fill="var(--color-primary)"/>
          <path d="M16 4 L16 10 M16 22 L16 28 M4 16 L10 16 M22 16 L28 16" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">NEYEN <span class="logo-sub">/ crosslink graph</span></span>
      </div>
    </div>
    <div class="header-center">
      <div class="stats-bar" id="statsBar">
        <span class="stat-item"><span class="stat-val" id="nodeCount">—</span> nodes</span>
        <span class="stat-sep">·</span>
        <span class="stat-item"><span class="stat-val" id="edgeCount">—</span> edges</span>
        <span class="stat-sep">·</span>
        <span class="stat-item"><span class="stat-val" id="orphanCount">—</span> orphaned</span>
      </div>
    </div>
    <div class="header-right">
      <div class="controls">
        <button class="btn-icon" id="refreshBtn" title="Refresh data" aria-label="Refresh graph data">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="btn-icon" id="fitBtn" title="Fit to screen" aria-label="Fit graph to screen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button class="btn-icon" data-theme-toggle aria-label="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Legend -->
  <div class="legend" aria-label="Node color legend">
    <div class="legend-item"><span class="legend-dot" style="background:var(--node-realisation)"></span>realisation</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--node-exploration)"></span>exploration</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--node-conflict)"></span>conflict</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--node-symbol)"></span>symbol</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--node-system)"></span>system</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--node-orphan)"></span>orphaned</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--node-default)"></span>other</div>
  </div>

  <!-- Graph canvas -->
  <main class="graph-stage" id="graphStage" role="main" aria-label="Crosslink force graph">
    <svg id="graphSvg" aria-hidden="true"></svg>
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <p>Loading graph data…</p>
    </div>
    <div class="empty-state hidden" id="emptyState">
      <p>No crosslinked entries yet.</p>
    </div>
  </main>

  <!-- Node detail panel -->
  <aside class="detail-panel hidden" id="detailPanel" aria-label="Node details">
    <button class="panel-close" id="panelClose" aria-label="Close panel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="panel-content">
      <div class="panel-role" id="panelRole"></div>
      <h2 class="panel-title" id="panelTitle"></h2>
      <p class="panel-summary" id="panelSummary"></p>
      <div class="panel-meta">
        <div class="meta-row" id="panelTags"></div>
        <div class="meta-row" id="panelEntities"></div>
        <div class="meta-row">
          <span class="meta-label">Timeline</span>
          <span class="meta-val" id="panelTimeline"></span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Created</span>
          <span class="meta-val" id="panelCreated"></span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Connections</span>
          <span class="meta-val" id="panelConnections"></span>
        </div>
        <div class="meta-row" id="panelOrphanRow" style="display:none">
          <span class="meta-label orphan-label">⚠ Orphaned</span>
          <span class="meta-val" id="panelDaysOld"></span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Orphan tray -->
  <div class="orphan-tray hidden" id="orphanTray">
    <div class="tray-header">
      <span class="tray-title">⚠ Orphaned Nodes</span>
      <span class="tray-subtitle" id="traySubtitle"></span>
      <button class="tray-close" id="trayClose" aria-label="Close orphan tray">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <ul class="tray-list" id="trayList" role="list"></ul>
  </div>

  <button class="orphan-fab hidden" id="orphanFab" aria-label="Show orphaned nodes">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span id="orphanFabCount"></span>
  </button>

  <script src="app.js"></script>
</body>
</html>
